<!doctype html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#060a14" />
    <meta
      name="description"
      content="Entenda o que passa e o que não passa na garantia dos serviços da BH Assistência Técnica: troca de tela, bateria, conector de carga e reparos em placa."
    />
    <title>Garantia BH Assistência técnica</title>
    <script>
      // Aplica o tema antes da pintura para evitar flash. Escuro é o padrão.
      try {
        var t = localStorage.getItem("bh-theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
